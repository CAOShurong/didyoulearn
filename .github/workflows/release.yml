name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Require the tag to point at current main
        run: |
          git fetch origin main --depth=1
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
      - name: Validate tag and package version
        run: python scripts/release_gate.py --tag "$GITHUB_REF_NAME"
      - name: Test release source
        run: |
          python -m pip install --upgrade build pytest ruff twine
          ruff check .
          ruff format --check .
          python -m pytest
          python scripts/build_site.py
      - name: Build and inspect distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/didyoulearn-release
          /tmp/didyoulearn-release/bin/python -m pip install dist/*.whl
          /tmp/didyoulearn-release/bin/didyoulearn --version
          /tmp/didyoulearn-release/bin/didyoulearn doctor
          /tmp/didyoulearn-release/bin/didyoulearn demo --output /tmp/didyoulearn-demo
          test -s /tmp/didyoulearn-demo/report.html
      - name: Generate checksums
        run: python scripts/release_gate.py --tag "$GITHUB_REF_NAME" --write-checksums dist
      - name: Attest distributions
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag \
            --title "DidYouLearn $GITHUB_REF_NAME" \
            --generate-notes
