name: Bug report
description: Report a reproducible software defect.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Include the command, input boundary, and complete error text. Remove private learner data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DidYouLearn version
      placeholder: "didyoulearn 0.1.0"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed names, emails, provider credentials, and private transcripts.
          required: true
