[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "didyoulearn"
version = "0.1.1"
description = "Outcome-based evaluation for AI tutors: did the learner actually learn?"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shurong Cao" }]
dependencies = []
keywords = [
  "ai-tutor",
  "llm-evaluation",
  "learning-gain",
  "education",
  "human-evaluation",
  "benchmark",
  "no-api",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Education",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://caoshurong.github.io/didyoulearn/"
Documentation = "https://github.com/CAOShurong/didyoulearn#readme"
Repository = "https://github.com/CAOShurong/didyoulearn"
Issues = "https://github.com/CAOShurong/didyoulearn/issues"
Changelog = "https://github.com/CAOShurong/didyoulearn/blob/main/CHANGELOG.md"

[project.scripts]
didyoulearn = "didyoulearn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
didyoulearn = ["web/*.html", "web/*.css", "web/*.js"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
